name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.24"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    services:
      # The registry's tests run against real Postgres rather than a fake. The
      # store is where uniqueness constraints, transactional promotion and
      # timestamp precision actually live, and an in-memory double agrees with
      # whatever the code does instead of telling you what the database does.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelforge
          POSTGRES_PASSWORD: modelforge
          POSTGRES_DB: modelforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MODELFORGE_TEST_DATABASE_URL: postgres://modelforge:modelforge@localhost:5432/modelforge_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^testdata/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      # -p 1 runs one package at a time. Several suites drive the whole stack
      # against the same Postgres and truncate it between cases, so running
      # packages concurrently has them resetting the database underneath each
      # other. The alternative — a database per package — buys parallelism this
      # suite does not need at its current size.
      #
      # -coverpkg attributes coverage to the package that owns the code rather
      # than the package running the test. Without it the end-to-end suites,
      # which exercise serving and routing through HTTP, would report those
      # packages as untested.
      - name: Test
        run: |
          go test -p 1 -race -coverpkg=./internal/... \
            -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.txt

      # A green job is not proof the tests ran. The registry suite fails rather
      # than skips when Postgres is unreachable, but a `t.Skip` added later
      # would silently hollow out the run while keeping this job green, so the
      # skips are checked for explicitly.
      - name: Fail if any test skipped
        run: |
          if grep -E '^\s*--- SKIP' test-output.txt; then
            echo "Tests were skipped; CI must run the full suite."; exit 1
          fi

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  fixtures:
    name: fixtures still match XGBoost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XGBoost
        run: pip install --quiet xgboost scikit-learn numpy

      # The committed fixtures are the scorer's specification, and they were
      # generated by one version of XGBoost. This job regenerates them against
      # whatever XGBoost currently ships and re-runs the parity tests, so a
      # change in how XGBoost scores a tree shows up as a failure here rather
      # than as a silent divergence between this scorer and the library it
      # claims to match. It does not compare files byte-for-byte: retraining
      # produces different trees, and the claim being tested is that the Go
      # scorer agrees with XGBoost, not that trees are reproducible.
      - name: Regenerate fixtures and re-check parity
        run: |
          python tools/fixtures/generate.py
          go test ./internal/runtime/xgboost/ -run TestAgainstXGBoost -v
