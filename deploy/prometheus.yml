global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: modelforge
    # /metrics requires the read scope, because it carries every model name,
    # version, request volume and drift reading — together a description of
    # what is being scored and how much of it. Prometheus sending a bearer
    # token is two lines, which is a cheap price for that.
    #
    # Mint one with `modelforgectl token prometheus read`, put the token in
    # deploy/prometheus-token (gitignored), and add its digest to the server's
    # MODELFORGE_TOKENS. `make up` creates a development token automatically.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      # host.docker.internal reaches a server run with `make run` on the host.
      # Running the server in the compose file instead would mean rebuilding
      # the image on every code change, which is the wrong trade for the loop
      # this stack is meant to support.
      - targets: ["host.docker.internal:8080"]
